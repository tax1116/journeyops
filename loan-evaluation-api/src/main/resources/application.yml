server:
  port: 8083
spring:
  application:
    name: loan-evaluation-api
logging:
  structured:
    format:
      console: ecs
      file: ecs
    json:
      customizer: dev.journeyops.observability.StructuredLogSanitizer
      context:
        prefix: custom
  file:
    name: ${JOURNEYOPS_LOG_FILE:build/logs/loan-evaluation-api.json}
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
journeyops:
  clients:
    user-base-url: ${USER_API_BASE_URL:http://localhost:8081}
    application-base-url: ${LOAN_APPLICATION_API_BASE_URL:http://localhost:8082}
sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: false
  max-request-body-size: none
  traces-sample-rate: 0.0
